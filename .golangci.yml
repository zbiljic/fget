version: "2"
output:
  formats:
    text:
      path: stdout
linters:
  enable:
    - gocritic
    - gocyclo
    - godox
    - makezero
    - misspell
    - unconvert
  settings:
    govet:
      disable:
        - inline
        - stdmethods
formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true
